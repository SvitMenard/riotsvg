<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<title>Riot Games Logo – Canvas Color Picker</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
  font-family: "Segoe UI", Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.app {
  background: #181818;
  padding: 30px 40px;
  border-radius: 18px;
  width: 420px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

h1 {
  font-size: 20px;
  margin-bottom: 20px;
  font-weight: 600;
}

.controls {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
}

.control {
  flex: 1;
  background: #222;
  border-radius: 12px;
  padding: 12px;
  text-align: left;
}

.control label {
  display: block;
  font-size: 12px;
  opacity: 0.8;
  margin-bottom: 8px;
}

.control input[type="color"] {
  width: 100%;
  height: 42px;
  border: none;
  border-radius: 8px;
  background: none;
  cursor: pointer;
}

canvas {
  display: block;
  margin: 20px auto;
  border-radius: 16px;
  background: #111;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  background: linear-gradient(135deg, #d32f2f, #b71c1c);
  color: white;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(211,47,47,0.4);
}
</style>
</head>

<body>

<div class="app">
  <h1>Riot Games Logo (Canvas)</h1>

  <div class="controls">
    <div class="control">
      <label>Background color</label>
      <input type="color" id="circleColor" value="#d32f2f">
    </div>

    <div class="control">
      <label>Logo color</label>
      <input type="color" id="polygonColor" value="#ffffff">
    </div>
  </div>

  <canvas id="canvas" width="300" height="300"></canvas>

  <button onclick="location.href='riotgames.html'">
    Pojdi na SVG verzijo
  </button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const circleColorInput = document.getElementById('circleColor');
const polygonColorInput = document.getElementById('polygonColor');

const points1 = [
  [162,82],[75,117],[87.8,173.6],[104,173.6],[101.3,133],[103.8,132.2],
  [113.6,173.6],[130.5,173.6],[129.9,124],[132.4,123.3],[140.9,173.6],
  [158.8,173.6],[163.1,113.8],[165.6,113.0],[170,173.6],[193.7,173.6],[202.1,90.4]
];

const points2 = [
  [141.6,196.9],[135.8,181.7],[192.7,184.6],[190.3,208.9]
];

function drawPolygonBezier(points, fillColor) {
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for(let i=1;i<points.length;i++){
    const p = points[i];
    ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
}

function drawLogo() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = circleColorInput.value;
  ctx.beginPath();
  ctx.arc(150,150,120,0,Math.PI*2);
  ctx.fill();

  drawPolygonBezier(points1, polygonColorInput.value);
  drawPolygonBezier(points2, polygonColorInput.value);
}

drawLogo();

circleColorInput.addEventListener('input', drawLogo);
polygonColorInput.addEventListener('input', drawLogo);
</script>

</body>
</html>
